<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Animes - AniList</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; margin: 0; padding: 20px; color: #eee; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #00d4ff; text-shadow: 0 0 10px rgba(0,212,255,0.5); }
        .search-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .search-box-wrapper {
            position: relative;
            width: 320px;
            max-width: 100%;
        }
        input[type="text"] {
            padding: 12px;
            font-size: 16px;
            width: 320px;
            max-width: 100%;
            border: 2px solid #00d4ff;
            border-radius: 8px;
            outline: none;
            background: #16213e;
            color: #fff;
            box-sizing: border-box;
        }
        .autocomplete-list {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            right: 0;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 10px;
            overflow: hidden;
            z-index: 50;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
            max-height: 420px;
            overflow-y: auto;
        }
        .autocomplete-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover,
        .autocomplete-item.active {
            background: rgba(0,212,255,0.15);
        }
        .autocomplete-item img {
            width: 34px;
            height: 48px;
            object-fit: cover;
            border-radius: 4px;
            background: #0f3460;
            flex-shrink: 0;
        }
        .autocomplete-item .ac-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .autocomplete-item .ac-title {
            font-size: 14px;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .autocomplete-item .ac-title mark {
            background: rgba(0,212,255,0.35);
            color: #fff;
            border-radius: 2px;
        }
        .autocomplete-item .ac-meta {
            font-size: 11px;
            color: #8899aa;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .autocomplete-loading {
            padding: 10px 12px;
            font-size: 13px;
            color: #00d4ff;
        }
        .autocomplete-empty {
            padding: 10px 12px;
            font-size: 13px;
            color: #8899aa;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }
        button:hover { background: #00a8cc; transform: scale(1.05); }
        .sfw-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            color: #ff6b9d;
            font-weight: bold;
            cursor: pointer;
        }
        .sfw-toggle input { transform: scale(1.2); cursor: pointer; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: #16213e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.2s;
            border: 1px solid #0f3460;
        }
        .card:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 8px 25px rgba(0,212,255,0.3); }
        .card img { width: 100%; height: 300px; object-fit: cover; background: #0f3460; }
        .card h3 { 
            padding: 12px; 
            text-align: center; 
            margin: 0; 
            font-size: 14px; 
            color: #fff;
        }
        .loading { text-align: center; font-size: 18px; color: #00d4ff; margin: 40px; }
        .warning { 
            background: linear-gradient(90deg, #ff6b9d, #ff8e53);
            color: #fff;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            display: inline-block;
            margin: 10px 0;
            box-shadow: 0 4px 15px rgba(255,107,157,0.4);
        }
        .error-msg { 
            color: #ff6b6b; 
            text-align: center; 
            grid-column: 1 / -1; 
            padding: 20px; 
            background: rgba(255,107,107,0.1);
            border: 1px solid #ff6b6b;
            border-radius: 8px;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 5px;
        }
        .badge-hentai { background: #ff6b9d; color: white; }
        .badge-nsfw { background: #ff8e53; color: white; }
    </style>
</head>
<body>
    <header>
        <h1>🔍 Buscador de Animes (AniList)</h1>
        <div class="search-bar">
            <div class="search-box-wrapper">
                <input type="text" id="search-input" placeholder="Ej: Akame ga kill" autofocus autocomplete="off">
                <div id="autocomplete-list" class="autocomplete-list" style="display: none;"></div>
            </div>
            <button id="search-btn">Buscar</button>
            <label class="sfw-toggle">
                <input type="checkbox" id="sfw-checkbox" checked>
                Solo contenido SFW
            </label>
        </div>
        <div id="nsfw-warning" class="warning" style="display: none;">⚠️ MODO +18 ACTIVADO - Contenido explícito visible</div>
    </header>

    <div id="anime-list" class="grid"></div>
    <div id="loading" class="loading" style="display: none;"> Buscando en AniList...</div>

<script>
    const API_URL = 'https://graphql.anilist.co';
    const lista = document.getElementById('anime-list');
    const loading = document.getElementById('loading');
    const input = document.getElementById('search-input');
    const btn = document.getElementById('search-btn');
    const nsfwWarning = document.getElementById('nsfw-warning');
    const sfwCheckbox = document.getElementById('sfw-checkbox');

    sfwCheckbox.addEventListener('change', () => {
        nsfwWarning.style.display = sfwCheckbox.checked ? 'none' : 'inline-block';
        if (input.value.trim()) fetchAutocomplete(input.value.trim());
    });

    // ===== AUTOCOMPLETADO (estilo Google) =====
    const acList = document.getElementById('autocomplete-list');
    let acDebounceTimer = null;
    let acAbortController = null;
    let acCurrentItems = [];
    let acActiveIndex = -1;
    let acRequestId = 0; // evita que respuestas viejas pisen a las nuevas

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, c => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
    }

    // Resalta la parte del título que coincide con lo escrito
    function highlightMatch(title, query) {
        const safeTitle = escapeHtml(title);
        const idx = title.toLowerCase().indexOf(query.toLowerCase());
        if (idx === -1) return safeTitle;
        const before = escapeHtml(title.slice(0, idx));
        const match = escapeHtml(title.slice(idx, idx + query.length));
        const after = escapeHtml(title.slice(idx + query.length));
        return `${before}<mark>${match}</mark>${after}`;
    }

    function closeAutocomplete() {
        acList.style.display = 'none';
        acList.innerHTML = '';
        acCurrentItems = [];
        acActiveIndex = -1;
    }

    function renderAutocompleteLoading() {
        acList.style.display = 'block';
        acList.innerHTML = `<div class="autocomplete-loading"> Buscando...</div>`;
    }

    function renderAutocomplete(items, query) {
        acCurrentItems = items;
        acActiveIndex = -1;

        if (items.length === 0) {
            acList.style.display = 'block';
            acList.innerHTML = `<div class="autocomplete-empty">Sin coincidencias</div>`;
            return;
        }

        acList.innerHTML = items.map((anime, i) => {
            const title = anime.title.english || anime.title.romaji || anime.title.native;
            const img = anime.coverImage.medium || anime.coverImage.large;
            const year = anime.seasonYear ? anime.seasonYear : '';
            const adultBadge = anime.isAdult ? '<span class="badge badge-hentai" style="margin-left:0;">+18</span>' : '';
            return `
                <div class="autocomplete-item" data-index="${i}">
                    <img src="${img}" alt="" loading="lazy">
                    <div class="ac-info">
                        <span class="ac-title">${highlightMatch(title, query)}</span>
                        <span class="ac-meta">${year} ${adultBadge}</span>
                    </div>
                </div>
            `;
        }).join('');
        acList.style.display = 'block';

        acList.querySelectorAll('.autocomplete-item').forEach(el => {
            el.addEventListener('click', () => {
                const item = acCurrentItems[parseInt(el.dataset.index, 10)];
                selectAutocompleteItem(item);
            });
        });
    }

    function selectAutocompleteItem(anime) {
        const title = anime.title.english || anime.title.romaji || anime.title.native;
        input.value = title;
        closeAutocomplete();
        buscarAnimes();
    }

    function setActiveItem(newIndex) {
        const items = acList.querySelectorAll('.autocomplete-item');
        if (items.length === 0) return;
        items.forEach(el => el.classList.remove('active'));
        acActiveIndex = (newIndex + items.length) % items.length;
        const activeEl = items[acActiveIndex];
        activeEl.classList.add('active');
        activeEl.scrollIntoView({ block: 'nearest' });
    }

async function fetchAutocomplete(query) {
    const myRequestId = ++acRequestId;

    if (acAbortController) acAbortController.abort();
    acAbortController = new AbortController();

    // Construimos las variables dinámicamente
    const variables = {
        search: query,
        perPage: 8
    };

    // Solo agregamos isAdult cuando queremos filtrar SFW
    if (sfwCheckbox.checked) {
        variables.isAdult = false;
    }
    // Si no está checked → no mandamos isAdult → AniList devuelve SFW + NSFW

    const graphqlQuery = {
        query: `
            query($search: String, $perPage: Int, $isAdult: Boolean) {
                Page(perPage: $perPage) {
                    media(search: $search, type: ANIME, sort: SEARCH_MATCH, isAdult: $isAdult) {
                        id
                        idMal
                        title { romaji english native }
                        coverImage { medium large }
                        seasonYear
                        isAdult
                    }
                }
            }
        `,
        variables: variables
    };

    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(graphqlQuery),
            signal: acAbortController.signal
        });
        const data = await response.json();

        if (myRequestId !== acRequestId) return;

        const items = data.data?.Page?.media || [];
        renderAutocomplete(items, query);
    } catch (e) {
        if (e.name === 'AbortError') return;
        console.error('Autocomplete error:', e);
        closeAutocomplete();
    }
}
    input.addEventListener('input', () => {
        const query = input.value.trim();
        clearTimeout(acDebounceTimer);

        if (!query) {
            closeAutocomplete();
            return;
        }

        renderAutocompleteLoading();
        acDebounceTimer = setTimeout(() => fetchAutocomplete(query), 300);
    });

    input.addEventListener('keydown', (e) => {
        const isOpen = acList.style.display === 'block' && acCurrentItems.length > 0;

        if (e.key === 'ArrowDown') {
            if (!isOpen) return;
            e.preventDefault();
            setActiveItem(acActiveIndex + 1);
        } else if (e.key === 'ArrowUp') {
            if (!isOpen) return;
            e.preventDefault();
            setActiveItem(acActiveIndex - 1);
        } else if (e.key === 'Enter') {
            if (isOpen && acActiveIndex >= 0) {
                e.preventDefault();
                selectAutocompleteItem(acCurrentItems[acActiveIndex]);
            }
            // si no hay item activo, el listener de "keypress" original hace la búsqueda normal
        } else if (e.key === 'Escape') {
            closeAutocomplete();
        }
    });

    // Cerrar el dropdown al hacer click fuera
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.search-box-wrapper')) {
            closeAutocomplete();
        }
    });

    async function buscarAnimes() {
        let query = input.value.trim();
        if (!query) return cargarTopAnimes();

        lista.innerHTML = '';
        loading.style.display = 'block';

        // Consulta GraphQL para AniList
        const graphqlQuery = {
            query: `
                query($search: String, $perPage: Int) {
                    Page(perPage: $perPage) {
                        media(search: $search, type: ANIME, sort: SCORE_DESC) {
                            id
                            idMal
                            title {
                                romaji
                                english
                                native
                            }
                            coverImage {
                                large
                                medium
                            }
                            averageScore
                            genres
                            isAdult
                        }
                    }
                }
            `,
            variables: {
                search: query,
                perPage: 25
            }
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(graphqlQuery)
            });

            const data = await response.json();
            let animes = data.data?.Page?.media || [];

            // Filtrar contenido adulto si el checkbox está marcado
            if (sfwCheckbox.checked) {
                animes = animes.filter(anime => !anime.isAdult);
            }

            mostrarAnimes(animes, query);

        } catch (e) {
            console.error(e);
            lista.innerHTML = `<div class="error-msg"> Error: ${e.message}</div>`;
        } finally {
            loading.style.display = 'none';
        }
    }

    function mostrarAnimes(animes, query) {
        if (animes.length === 0) {
            lista.innerHTML = `<div class="error-msg">
                 No se encontraron resultados para "${query}"<br>
                <small>Prueba con otro nombre o verifica la ortografía</small>
            </div>`;
            return;
        }

        lista.innerHTML = '';
        animes.forEach(anime => {
            const card = document.createElement('div');
            card.className = 'card';
            
            const title = anime.title.english || anime.title.romaji || anime.title.native;
            const imgUrl = anime.coverImage.large || anime.coverImage.medium;
            const score = anime.averageScore || 'N/A';
            const isAdult = anime.isAdult;
            
            // Badge para contenido +18
            const badge = isAdult ? '<span class="badge badge-hentai">+18</span>' : '';
            
            card.innerHTML = `
                <img src="${imgUrl}" alt="${title}" loading="lazy">
                <h3>${title} ${badge}<br><small style="color: #00d4ff">★ ${score}</small></h3>
            `;
            
            const malId = anime.idMal || anime.id;
            card.onclick = () => {
                if (malId) {
                    window.location.href = `detalle.html?id=${malId}`;
                } else {
                    alert(`AniList ID: ${anime.id}`);
                }
            };
            lista.appendChild(card);
        });
    }

    async function cargarTopAnimes() {
        lista.innerHTML = '';
        loading.style.display = 'block';
        
        const graphqlQuery = {
            query: `
                query {
                    Page(perPage: 24) {
                        media(type: ANIME, sort: SCORE_DESC, isAdult: false) {
                            id
                            idMal
                            title {
                                romaji
                                english
                            }
                            coverImage {
                                large
                            }
                            averageScore
                            isAdult
                        }
                    }
                }
            `
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(graphqlQuery)
            });
            const data = await response.json();
            mostrarAnimes(data.data?.Page?.media || [], 'Top Animes');
        } catch(e) {
            console.error(e);
            lista.innerHTML = `<div class="error-msg">❌ Error al cargar top animes</div>`;
        } finally {
            loading.style.display = 'none';
        }
    }

    btn.addEventListener('click', buscarAnimes);
    input.addEventListener('keypress', e => { if (e.key === 'Enter') buscarAnimes(); });
    window.addEventListener('load', cargarTopAnimes);
</script>
</body>
</html>
